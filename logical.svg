<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1180" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fda-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="fdb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="node-wan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="node-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="node-agg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="node-acc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE BLOCK -->
  <text x="575" y="28" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1">ABC HQ - ROUTED ACCESS L3 UNDERLAY &amp; VXLAN EVPN TOPOLOGY</text>
  <text x="575" y="48" text-anchor="middle" fill="#94a3b8" font-size="12">Full L3 Fabric with Access Layer VTEPs (Campus Autonomous System: AS 65100)</text>

  <!-- FAILURE DOMAINS -->
  <!-- Domain A (Red) -->
  <rect x="50" y="70" width="500" height="970" rx="16" fill="url(#fda-grad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="70" y="85" width="220" height="28" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="80" y="104" fill="#fca5a5" font-size="13" font-weight="700">FAILURE DOMAIN A (FD-A)</text>

  <!-- Domain B (Blue) -->
  <rect x="600" y="70" width="500" height="970" rx="16" fill="url(#fdb-grad)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="620" y="85" width="220" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="630" y="104" fill="#93c5fd" font-size="13" font-weight="700">FAILURE DOMAIN B (FD-B)</text>

  <!-- EXTERNAL BGP PEERING LINKS -->
  <!-- Provider A eBGP -->
  <path d="M 165,55 L 165,130" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="85" y="40" width="160" height="22" rx="4" fill="#b45309"/>
  <text x="165" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">eBGP | Provider A (AS 65530)</text>

  <!-- Provider B eBGP -->
  <path d="M 915,55 L 915,130" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="835" y="40" width="160" height="22" rx="4" fill="#b45309"/>
  <text x="915" y="55" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">eBGP | Provider B (AS 65531)</text>

  <!-- INTER-DEVICE LINKS & IP INTERCONNECTS -->
  <!-- WAN Interconnect -->
  <path d="M 240,165 L 840,165" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="490" y="153" width="170" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="575" y="169" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">iBGP WAN Peer (AS 65100)</text>

  <!-- Core Mesh Links -->
  <path d="M 240,325 L 260,325" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 810,325 L 820,325" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- WAN to Core Matrix -->
  <path d="M 165,200 L 165,290" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 185,200 L 725,290" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 915,200 L 915,290" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 895,200 L 355,290" stroke="#38bdf8" stroke-width="2"/>

  <!-- Core to Agg Underlay Links -->
  <path d="M 165,360 L 165,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 165,360 L 335,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 335,360 L 165,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 335,360 L 335,450" stroke="#38bdf8" stroke-width="2"/>

  <path d="M 725,360 L 725,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 725,360 L 895,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 895,360 L 725,450" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 895,360 L 895,450" stroke="#38bdf8" stroke-width="2"/>

  <!-- Agg to Access L3 Links -->
  <path d="M 165,525 L 165,600" stroke="#10b981" stroke-width="2"/>
  <path d="M 165,525 L 895,600" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 335,525 L 165,600" stroke="#10b981" stroke-width="2"/>
  <path d="M 725,525 L 895,600" stroke="#10b981" stroke-width="2"/>
  <path d="M 895,525 L 895,600" stroke="#10b981" stroke-width="2"/>

  <!-- ROUTED ACCESS OVERLAY CONTAINER -->
  <rect x="70" y="700" width="1010" height="320" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="90" y="725" fill="#f59e0b" font-size="14" font-weight="700">EXTENDED VXLAN EVPN OVERLAY SERVICES (ACCESS LAYER VTEPS)</text>

  <!-- VNI MAPPING CARDS -->
  <rect x="90" y="745" width="300" height="130" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <rect x="100" y="755" width="70" height="22" rx="4" fill="#0284c7"/>
  <text x="135" y="770" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">VNI 10</text>
  <text x="180" y="770" fill="#f8fafc" font-size="13" font-weight="700">Campus_Users</text>
  <line x1="100" y1="785" x2="370" y2="785" stroke="#334155" stroke-width="1"/>
  <text x="100" y="805" fill="#94a3b8" font-size="11">VLAN 10 | Primary user network segment</text>
  <text x="100" y="825" fill="#94a3b8" font-size="11">VTEP Source: Loopback1 (Access Switch)</text>
  <text x="100" y="855" fill="#38bdf8" font-size="10" font-weight="600">Peering: iBGP-EVPN (AS 65100)</text>

  <rect x="425" y="745" width="300" height="130" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <rect x="435" y="755" width="70" height="22" rx="4" fill="#0284c7"/>
  <text x="470" y="770" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">VNI 20</text>
  <text x="515" y="770" fill="#f8fafc" font-size="13" font-weight="700">Security_Cameras</text>
  <line x1="435" y1="785" x2="705" y2="785" stroke="#334155" stroke-width="1"/>
  <text x="435" y="805" fill="#94a3b8" font-size="11">VLAN 20 | IoT/OT segment for cameras</text>
  <text x="435" y="825" fill="#94a3b8" font-size="11">VTEP Source: Loopback1 (Access Switch)</text>
  <text x="435" y="855" fill="#38bdf8" font-size="10" font-weight="600">Peering: iBGP-EVPN (AS 65100)</text>

  <rect x="760" y="745" width="300" height="130" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <rect x="770" y="755" width="75" height="22" rx="4" fill="#b91c1c"/>
  <text x="807" y="770" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">VNI 999</text>
  <text x="855" y="770" fill="#f8fafc" font-size="13" font-weight="700">Critical_Services</text>
  <line x1="770" y1="785" x2="1040" y2="785" stroke="#334155" stroke-width="1"/>
  <text x="770" y="805" fill="#94a3b8" font-size="11">VLAN 999 | Fallback segment (NAC dead action)</text>
  <text x="770" y="825" fill="#94a3b8" font-size="11">VTEP Source: Loopback1 (Access Switch)</text>
  <text x="770" y="855" fill="#ef4444" font-size="10" font-weight="600">Peering: iBGP-EVPN (AS 65100)</text>

  <!-- HIGHLIGHT FLOORS BANNER -->
  <rect x="90" y="895" width="970" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="110" y="925" fill="#10b981" font-size="13" font-weight="700">ROUTED ACCESS FLOOR DEPLOYMENT (FLOORS 1 THROUGH 10)</text>
  <text x="110" y="948" fill="#94a3b8" font-size="11">• Each access switch runs L3 underlay links directly to Aggregation tier switches using /31 subnets (e.g., 10.24.1.0/31).</text>
  <text x="110" y="968" fill="#94a3b8" font-size="11">• Each access switch operates as an independent VTEP with unique Loopback1 IP (e.g., 10.128.1.1/32 for f01-acc-01).</text>
  <text x="110" y="988" fill="#94a3b8" font-size="11">• All tiers communicate within a unified campus Autonomous System (AS 65100) running iBGP EVPN overlays.</text>

  <!-- DEVICE NODES LAYER -->

  <!-- WAN LAYER ROUTERS -->
  <g id="wan-routers" filter="url(#shadow)">
    <rect x="90" y="130" width="150" height="70" rx="8" fill="url(#node-wan)"/>
    <text x="165" y="150" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-01</text>
    <text x="165" y="166" text-anchor="middle" fill="#e0f2fe" font-size="10">BGP AS 65100</text>
    <text x="165" y="180" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.0.0.1/32</text>

    <rect x="840" y="130" width="150" height="70" rx="8" fill="url(#node-wan)"/>
    <text x="915" y="150" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-02</text>
    <text x="915" y="166" text-anchor="middle" fill="#e0f2fe" font-size="10">BGP AS 65100</text>
    <text x="915" y="180" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.0.0.2/32</text>
  </g>

  <!-- CORE LAYER ROUTERS -->
  <g id="core-routers" filter="url(#shadow)">
    <rect x="90" y="290" width="150" height="70" rx="8" fill="url(#node-core)"/>
    <text x="165" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-01</text>
    <text x="165" y="326" text-anchor="middle" fill="#f3e8ff" font-size="10">BGP AS 65100</text>
    <text x="165" y="340" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.1.0.1/32</text>

    <rect x="260" y="290" width="150" height="70" rx="8" fill="url(#node-core)"/>
    <text x="335" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-02</text>
    <text x="335" y="326" text-anchor="middle" fill="#f3e8ff" font-size="10">BGP AS 65100</text>
    <text x="335" y="340" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.1.0.2/32</text>

    <rect x="650" y="290" width="150" height="70" rx="8" fill="url(#node-core)"/>
    <text x="725" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-03</text>
    <text x="725" y="326" text-anchor="middle" fill="#f3e8ff" font-size="10">BGP AS 65100</text>
    <text x="725" y="340" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.1.0.3/32</text>

    <rect x="820" y="290" width="150" height="70" rx="8" fill="url(#node-core)"/>
    <text x="895" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-04</text>
    <text x="895" y="326" text-anchor="middle" fill="#f3e8ff" font-size="10">BGP AS 65100</text>
    <text x="895" y="340" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">Lo0: 10.1.0.4/32</text>
  </g>

  <!-- AGGREGATION LAYER SWITCHES -->
  <g id="agg-switches" filter="url(#shadow)">
    <rect x="90" y="450" width="150" height="75" rx="8" fill="url(#node-agg)"/>
    <text x="165" y="468" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-01</text>
    <text x="165" y="482" text-anchor="middle" fill="#fef3c7" font-size="9">Lo0 (Mgmt): 10.2.0.1/32</text>
    <text x="165" y="496" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.0.1/32</text>
    <text x="165" y="510" text-anchor="middle" fill="#fef3c7" font-size="9">iBGP-EVPN (AS 65100)</text>

    <rect x="260" y="450" width="150" height="75" rx="8" fill="url(#node-agg)"/>
    <text x="335" y="468" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-02</text>
    <text x="335" y="482" text-anchor="middle" fill="#fef3c7" font-size="9">Lo0 (Mgmt): 10.2.0.2/32</text>
    <text x="335" y="496" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.0.2/32</text>
    <text x="335" y="510" text-anchor="middle" fill="#fef3c7" font-size="9">iBGP-EVPN (AS 65100)</text>

    <rect x="650" y="450" width="150" height="75" rx="8" fill="url(#node-agg)"/>
    <text x="725" y="468" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-03</text>
    <text x="725" y="482" text-anchor="middle" fill="#fef3c7" font-size="9">Lo0 (Mgmt): 10.2.0.3/32</text>
    <text x="725" y="496" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.0.3/32</text>
    <text x="725" y="510" text-anchor="middle" fill="#fef3c7" font-size="9">iBGP-EVPN (AS 65100)</text>

    <rect x="820" y="450" width="150" height="75" rx="8" fill="url(#node-agg)"/>
    <text x="895" y="468" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-04</text>
    <text x="895" y="482" text-anchor="middle" fill="#fef3c7" font-size="9">Lo0 (Mgmt): 10.2.0.4/32</text>
    <text x="895" y="496" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.0.4/32</text>
    <text x="895" y="510" text-anchor="middle" fill="#fef3c7" font-size="9">iBGP-EVPN (AS 65100)</text>
  </g>

  <!-- ROUTED ACCESS LAYER VTEP SWITCHES -->
  <g id="acc-switches" filter="url(#shadow)">
    <!-- f01-acc-01 -->
    <rect x="90" y="600" width="150" height="75" rx="8" fill="url(#node-acc)"/>
    <text x="165" y="618" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">abc-hq-f01-acc-01</text>
    <text x="165" y="632" text-anchor="middle" fill="#d1fae5" font-size="9">Lo0 (Mgmt): 10.3.0.1/32</text>
    <text x="165" y="646" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.1.1/32</text>
    <text x="165" y="660" text-anchor="middle" fill="#d1fae5" font-size="9">iBGP-EVPN (AS 65100)</text>

    <!-- f01-acc-02 -->
    <rect x="820" y="600" width="150" height="75" rx="8" fill="url(#node-acc)"/>
    <text x="895" y="618" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">abc-hq-f01-acc-02</text>
    <text x="895" y="632" text-anchor="middle" fill="#d1fae5" font-size="9">Lo0 (Mgmt): 10.3.0.2/32</text>
    <text x="895" y="646" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Lo1 (VTEP): 10.128.1.2/32</text>
    <text x="895" y="660" text-anchor="middle" fill="#d1fae5" font-size="9">iBGP-EVPN (AS 65100)</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(130, 1050)" filter="url(#shadow)">
    <rect x="0" y="0" width="890" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">LEGEND:</text>
    
    <line x1="90" y1="26" x2="130" y2="26" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="140" y="30" fill="#94a3b8" font-size="11">External eBGP Link</text>

    <line x1="280" y1="26" x2="320" y2="26" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="330" y="30" fill="#94a3b8" font-size="11">Core/WAN L3 Underlay Link</text>

    <line x1="510" y1="26" x2="550" y2="26" stroke="#10b981" stroke-width="2.5"/>
    <text x="560" y="30" fill="#94a3b8" font-size="11">Routed Access L3 Link</text>

    <line x1="720" y1="26" x2="760" y2="26" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="770" y="30" fill="#94a3b8" font-size="11">EVPN Overlay Domain</text>
  </g>
</svg>
