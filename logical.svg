<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1450" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients for Failure Domains -->
    <linearGradient id="fda-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="fdb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="wan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="core-a-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="core-b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="agg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="vtep-a-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="vtep-b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE BLOCK -->
  <text x="625" y="30" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">ABC HQ - LOGICAL BGP (CORE AS ROUTE REFLECTOR) &amp; VXLAN EVPN</text>
  <text x="625" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">Unified Campus AS 65100 | Cores as Separate BGP Route Reflectors (All iBGP Dotted)</text>

  <!-- FAILURE DOMAIN CONTAINERS -->
  <!-- FD-A Container (X: 40 to 600, Center X: 320) -->
  <rect x="40" y="72" width="560" height="955" rx="16" fill="url(#fda-bg)" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="92" width="245" height="28" rx="6" fill="#ef4444" fill-opacity="0.25"/>
  <text x="72" y="111" fill="#fca5a5" font-size="13" font-weight="700">FAILURE DOMAIN A (FD-A)</text>

  <!-- FD-B Container (X: 650 to 1210, Center X: 930) -->
  <rect x="650" y="72" width="560" height="955" rx="16" fill="url(#fdb-bg)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="670" y="92" width="245" height="28" rx="6" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="682" y="111" fill="#93c5fd" font-size="13" font-weight="700">FAILURE DOMAIN B (FD-B)</text>

  <!-- ==================== BGP SESSIONS & OVERLAYS ==================== -->

  <!-- External eBGP connections -->
  <path d="M 320,147 L 320,100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 930,147 L 930,100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- WAN to Core iBGP Sessions (Dotted) -->
  <path d="M 280,267 L 250,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 360,267 L 390,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 890,267 L 860,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 970,267 L 1000,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Cross-Domain Core iBGP Mesh Session (Centered Cores) -->
  <path d="M 450,442 L 800,442" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Core-01 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 250,497 L 115,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 250,497 L 385,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 250,497 L 210,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Core-02 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 390,497 L 115,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 390,497 L 385,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 390,497 L 210,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Core-03 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 860,497 L 865,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 860,497 L 1135,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 860,497 L 990,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Core-04 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 1000,497 L 865,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 1000,497 L 1135,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 1000,497 L 990,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- VXLAN EVPN Overlay Virtual Tunnel Connections (Mesh between Access VTEPs) -->
  <path d="M 310,882 L 890,882" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,6"/>

  <!-- ==================== NETWORK NODES ==================== -->

  <!-- LAYER 1: WAN ROUTERS (Centered in FD-A: X=220, FD-B: X=830) -->
  <g id="wan-01" filter="url(#shadow)">
    <rect x="220" y="147" width="200" height="120" rx="8" fill="url(#wan-grad)"/>
    <text x="320" y="172" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-wan-01</text>
    <text x="320" y="192" text-anchor="middle" fill="#fef3c7" font-size="11">AS 65100 | ID: 10.0.0.1</text>
    <line x1="235" y1="202" x2="405" y2="202" stroke="#d97706" stroke-width="1"/>
    <text x="235" y="219" fill="#ffffff" font-size="10">• Lo0: 10.0.0.1/32 (Mgmt)</text>
    <text x="235" y="235" fill="#ffffff" font-size="10">• eBGP: ISP-A (AS 65530)</text>
    <text x="235" y="251" fill="#ffffff" font-size="10">• iBGP: core-01, core-03</text>
  </g>

  <g id="wan-02" filter="url(#shadow)">
    <rect x="830" y="147" width="200" height="120" rx="8" fill="url(#wan-grad)"/>
    <text x="930" y="172" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-wan-02</text>
    <text x="930" y="192" text-anchor="middle" fill="#fef3c7" font-size="11">AS 65100 | ID: 10.0.0.2</text>
    <line x1="845" y1="202" x2="1015" y2="202" stroke="#d97706" stroke-width="1"/>
    <text x="845" y="219" fill="#ffffff" font-size="10">• Lo0: 10.0.0.2/32 (Mgmt)</text>
    <text x="845" y="235" fill="#ffffff" font-size="10">• eBGP: ISP-B (AS 65531)</text>
    <text x="845" y="251" fill="#ffffff" font-size="10">• iBGP: core-02, core-04</text>
  </g>

  <!-- LAYER 2: CORE ROUTERS / SEPARATE ROUTE REFLECTORS (Centered in FD-A: X=195 & 335, FD-B: X=805 & 945) -->
  <g id="core-01" filter="url(#shadow)">
    <rect x="195" y="387" width="110" height="110" rx="8" fill="url(#core-a-grad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="250" y="410" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-01</text>
    <text x="250" y="428" text-anchor="middle" fill="#fca5a5" font-size="10">ID: 10.1.0.1</text>
    <line x1="205" y1="438" x2="295" y2="438" stroke="#b91c1c" stroke-width="1"/>
    <text x="205" y="454" fill="#fef3c7" font-size="9" font-weight="750">⭐ BGP RR</text>
    <text x="205" y="470" fill="#ffffff" font-size="9">AS 65100 iBGP</text>
  </g>

  <g id="core-02" filter="url(#shadow)">
    <rect x="335" y="387" width="110" height="110" rx="8" fill="url(#core-a-grad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="390" y="410" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-02</text>
    <text x="390" y="428" text-anchor="middle" fill="#fca5a5" font-size="10">ID: 10.1.0.2</text>
    <line x1="345" y1="438" x2="435" y2="438" stroke="#b91c1c" stroke-width="1"/>
    <text x="345" y="454" fill="#fef3c7" font-size="9" font-weight="750">⭐ BGP RR</text>
    <text x="345" y="470" fill="#ffffff" font-size="9">AS 65100 iBGP</text>
  </g>

  <g id="core-03" filter="url(#shadow)">
    <rect x="805" y="387" width="110" height="110" rx="8" fill="url(#core-b-grad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="860" y="410" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-03</text>
    <text x="860" y="428" text-anchor="middle" fill="#93c5fd" font-size="10">ID: 10.1.0.3</text>
    <line x1="815" y1="438" x2="905" y2="438" stroke="#1d4ed8" stroke-width="1"/>
    <text x="815" y="454" fill="#fef3c7" font-size="9" font-weight="750">⭐ BGP RR</text>
    <text x="815" y="470" fill="#ffffff" font-size="9">AS 65100 iBGP</text>
  </g>

  <g id="core-04" filter="url(#shadow)">
    <rect x="945" y="387" width="110" height="110" rx="8" fill="url(#core-b-grad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="1000" y="410" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-04</text>
    <text x="1000" y="428" text-anchor="middle" fill="#93c5fd" font-size="10">ID: 10.1.0.4</text>
    <line x1="955" y1="438" x2="1045" y2="438" stroke="#1d4ed8" stroke-width="1"/>
    <text x="955" y="454" fill="#fef3c7" font-size="9" font-weight="750">⭐ BGP RR</text>
    <text x="955" y="470" fill="#ffffff" font-size="9">AS 65100 iBGP</text>
  </g>

  <!-- LAYER 3: AGGREGATION SWITCHES -->
  <g id="agg-01" filter="url(#shadow)">
    <rect x="45" y="597" width="140" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="115" y="620" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-01</text>
    <text x="115" y="638" text-anchor="middle" fill="#cbd5e1" font-size="10">AS 65100 Client</text>
    <line x1="55" y1="648" x2="175" y2="648" stroke="#475569" stroke-width="1"/>
    <text x="55" y="665" fill="#ffffff" font-size="10">• Lo0: 10.2.0.1/32</text>
    <text x="55" y="681" fill="#e2e8f0" font-size="9" font-weight="600">• iBGP Client to Core RR</text>
  </g>

  <g id="agg-02" filter="url(#shadow)">
    <rect x="315" y="597" width="140" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="385" y="620" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-02</text>
    <text x="385" y="638" text-anchor="middle" fill="#cbd5e1" font-size="10">AS 65100 Client</text>
    <line x1="325" y1="648" x2="445" y2="648" stroke="#475569" stroke-width="1"/>
    <text x="325" y="665" fill="#ffffff" font-size="10">• Lo0: 10.2.0.2/32</text>
    <text x="325" y="681" fill="#e2e8f0" font-size="9" font-weight="600">• iBGP Client to Core RR</text>
  </g>

  <g id="agg-03" filter="url(#shadow)">
    <rect x="795" y="597" width="140" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="865" y="620" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-03</text>
    <text x="865" y="638" text-anchor="middle" fill="#cbd5e1" font-size="10">AS 65100 Client</text>
    <line x1="805" y1="648" x2="925" y2="648" stroke="#475569" stroke-width="1"/>
    <text x="805" y="665" fill="#ffffff" font-size="10">• Lo0: 10.2.0.3/32</text>
    <text x="805" y="681" fill="#e2e8f0" font-size="9" font-weight="600">• iBGP Client to Core RR</text>
  </g>

  <g id="agg-04" filter="url(#shadow)">
    <rect x="1065" y="597" width="140" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="1135" y="620" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-04</text>
    <text x="1135" y="638" text-anchor="middle" fill="#cbd5e1" font-size="10">AS 65100 Client</text>
    <line x1="1075" y1="648" x2="1195" y2="648" stroke="#475569" stroke-width="1"/>
    <text x="1075" y="665" fill="#ffffff" font-size="10">• Lo0: 10.2.0.4/32</text>
    <text x="1075" y="681" fill="#e2e8f0" font-size="9" font-weight="600">• iBGP Client to Core RR</text>
  </g>

  <!-- LAYER 4: ACCESS VTEPS (Representative Primary VTEPs) -->
  <g id="acc-01" filter="url(#shadow)">
    <rect x="110" y="807" width="200" height="160" rx="8" fill="url(#vtep-a-grad)"/>
    <text x="210" y="830" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-01</text>
    <text x="210" y="848" text-anchor="middle" fill="#fecdd3" font-size="10">AS 65100 VTEP (FD-A)</text>
    <line x1="120" y1="858" x2="300" y2="858" stroke="#9f1239" stroke-width="1"/>
    <text x="120" y="875" fill="#ffffff" font-size="10">• Lo0: 10.3.0.1/32</text>
    <text x="120" y="891" fill="#ffffff" font-size="10">• Lo1: 10.128.1.1/32</text>
    <text x="120" y="907" fill="#fecdd3" font-size="9">• EVPN Peer: Core RR</text>
    <text x="120" y="923" fill="#fef3c7" font-size="9" font-weight="700">• iBGP Client of Cor-01/02</text>
    <text x="120" y="939" fill="#fecdd3" font-size="9">• Overlay VTEP Endpoint</text>
  </g>

  <!-- Mention Text for FD-A scaled access switches -->
  <g transform="translate(340, 860)">
    <rect x="0" y="0" width="140" height="55" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="70" y="24" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Floors 2–10 Access</text>
    <text x="70" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">(Not Shown)</text>
  </g>

  <g id="acc-02" filter="url(#shadow)">
    <rect x="890" y="807" width="200" height="160" rx="8" fill="url(#vtep-b-grad)"/>
    <text x="990" y="830" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-02</text>
    <text x="990" y="848" text-anchor="middle" fill="#e0f2fe" font-size="10">AS 65100 VTEP (FD-B)</text>
    <line x1="900" y1="858" x2="1080" y2="858" stroke="#0284c7" stroke-width="1"/>
    <text x="900" y="875" fill="#ffffff" font-size="10">• Lo0: 10.3.0.2/32</text>
    <text x="900" y="891" fill="#ffffff" font-size="10">• Lo1: 10.128.1.2/32</text>
    <text x="900" y="907" fill="#e0f2fe" font-size="9">• EVPN Peer: Core RR</text>
    <text x="900" y="923" fill="#fef3c7" font-size="9" font-weight="700">• iBGP Client of Cor-03/04</text>
    <text x="900" y="939" fill="#e0f2fe" font-size="9">• Overlay VTEP Endpoint</text>
  </g>

  <!-- Mention Text for FD-B scaled access switches -->
  <g transform="translate(720, 860)">
    <rect x="0" y="0" width="140" height="55" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="70" y="24" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Floors 2–10 Access</text>
    <text x="70" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">(Not Shown)</text>
  </g>

  <!-- ==================== VXLAN VNI MAPPINGS CARD ==================== -->
  <g transform="translate(40, 1045)" filter="url(#shadow)">
    <rect x="0" y="0" width="1170" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="700">EVPN OVERLAY VNI SERVICE MAPPINGS (Access Tier Termination) - AS 65100</text>
    <line x1="25" y1="42" x2="1145" y2="42" stroke="#334155" stroke-width="1"/>

    <rect x="35" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="50" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 10 | VLAN 10</text>
    <text x="50" y="93" fill="#f8fafc" font-size="11" font-weight="600">Campus_Users</text>
    <text x="50" y="108" fill="#94a3b8" font-size="9">Primary user network segment</text>

    <rect x="257" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="272" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 20 | VLAN 20</text>
    <text x="272" y="93" fill="#f8fafc" font-size="11" font-weight="600">Security_Cameras</text>
    <text x="272" y="108" fill="#94a3b8" font-size="9">IoT/OT segment for cameras</text>

    <rect x="479" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="494" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 30 | VLAN 30</text>
    <text x="494" y="93" fill="#f8fafc" font-size="11" font-weight="600">Voice_VoIP</text>
    <text x="494" y="108" fill="#94a3b8" font-size="9">IP Telephony &amp; VoIP segment</text>

    <rect x="701" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="716" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 40 | VLAN 40</text>
    <text x="716" y="93" fill="#f8fafc" font-size="11" font-weight="600">Wireless_AP_Mgmt</text>
    <text x="716" y="108" fill="#94a3b8" font-size="9">CAPWAP mgmt infrastructure</text>

    <rect x="923" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="938" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 50 / 999</text>
    <text x="938" y="93" fill="#f8fafc" font-size="11" font-weight="600">IPTV &amp; Critical Services</text>
    <text x="938" y="108" fill="#94a3b8" font-size="9">Multicast &amp; fallback segments</text>
  </g>

  <!-- ==================== LEGEND PANEL ==================== -->
  <g transform="translate(40, 1200)" filter="url(#shadow)">
    <rect x="0" y="0" width="1170" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#f8fafc" font-size="12" font-weight="700">TOPOLOGY LEGEND:</text>

    <line x1="170" y1="26" x2="220" y2="26" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="230" y="30" fill="#94a3b8" font-size="11">iBGP Session (AS 65100 Dotted)</text>

    <line x1="460" y1="26" x2="510" y2="26" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="520" y="30" fill="#94a3b8" font-size="11">eBGP (External ISPs)</text>

    <line x1="700" y1="26" x2="750" y2="26" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="760" y="30" fill="#94a3b8" font-size="11">VXLAN EVPN Overlay Tunnel (NVE1)</text>

    <rect x="170" y="44" width="14" height="14" rx="3" fill="#f87171" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="192" y="56" fill="#fef3c7" font-size="11" font-weight="600">Gold border = Separate BGP Route Reflector nodes acting as RRs for Agg &amp; Access VTEPs within AS 65100</text>
  </g>
</svg>
