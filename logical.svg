<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1420" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients for Failure Domains -->
    <linearGradient id="fda-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="fdb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="wan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="core-a-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="core-b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="agg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="vtep-a-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="vtep-b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE BLOCK -->
  <text x="625" y="32" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">abc-hq - LOGICAL BGP, UNDERLAY &amp; VXLAN EVPN TOPOLOGY</text>
  <text x="625" y="55" text-anchor="middle" fill="#94a3b8" font-size="13">Unified Campus AS 65100 | Pure L3 Underlay Transit | EVPN Overlay Exclusively at Access VTEPs</text>

  <!-- FAILURE DOMAIN CONTAINERS -->
  <!-- FD-A Container -->
  <rect x="40" y="75" width="560" height="920" rx="16" fill="url(#fda-bg)" stroke="#ef4444" stroke-width="2"/>
  <rect x="60" y="95" width="230" height="28" rx="6" fill="#ef4444" fill-opacity="0.25"/>
  <text x="72" y="114" fill="#fca5a5" font-size="13" font-weight="700">FAILURE DOMAIN A (FD-A)</text>

  <!-- FD-B Container -->
  <rect x="650" y="75" width="560" height="920" rx="16" fill="url(#fdb-bg)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="670" y="95" width="230" height="28" rx="6" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="682" y="114" fill="#93c5fd" font-size="13" font-weight="700">FAILURE DOMAIN B (FD-B)</text>


  <!-- ==================== LOGICAL CONNECTIONS (UNDERLAY BGP & EVPN) ==================== -->

  <!-- External eBGP connections -->
  <path d="M 240,195 L 140,245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 1010,195 L 1110,245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- WAN to Core iBGP Underlay Links -->
  <path d="M 190,270 L 190,390" stroke="#10b981" stroke-width="3"/>
  <path d="M 1060,270 L 1060,390" stroke="#10b981" stroke-width="3"/>
  
  <!-- Cross-Domain iBGP Core Mesh -->
  <path d="M 270,425 L 980,425" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Core to Aggregation Underlay Links (FD-A & FD-B) -->
  <path d="M 190,460 L 190,600" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 1060,460 L 1060,600" stroke="#10b981" stroke-width="2.5"/>

  <!-- Aggregation to Access VTEP Underlay Links (Direct & Cross-Plane) -->
  <path d="M 155,670 L 155,810" stroke="#10b981" stroke-width="2"/>
  <path d="M 225,670 L 485,810" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <path d="M 1025,670 L 765,810" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 1095,670 L 1095,810" stroke="#10b981" stroke-width="2"/>

  <!-- VXLAN EVPN Overlay Virtual Tunnel Connections (Mesh between Access VTEPs) -->
  <path d="M 225,845 L 735,845" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,6"/>
  <path d="M 225,865 L 485,865" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,6"/>
  <path d="M 765,865 L 1025,865" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,6"/>


  <!-- ==================== NETWORK NODES ==================== -->

  <!-- LAYER 1: WAN ROUTERS -->
  <g id="wan-01" filter="url(#shadow)">
    <rect x="90" y="150" width="200" height="120" rx="8" fill="url(#wan-grad)"/>
    <text x="190" y="175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-wan-01</text>
    <text x="190" y="195" text-anchor="middle" fill="#fef3c7" font-size="11">AS 65100 | ID: 10.0.0.1</text>
    <line x1="105" y1="205" x2="275" y2="205" stroke="#d97706" stroke-width="1"/>
    <text x="105" y="222" fill="#ffffff" font-size="10">• Lo0: 10.0.0.1/32 (Mgmt)</text>
    <text x="105" y="238" fill="#ffffff" font-size="10">• eBGP: ISP-A (AS 65530)</text>
    <text x="105" y="254" fill="#ffffff" font-size="10">• iBGP: core-01, core-03</text>
  </g>

  <g id="wan-02" filter="url(#shadow)">
    <rect x="960" y="150" width="200" height="120" rx="8" fill="url(#wan-grad)"/>
    <text x="1060" y="175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-wan-02</text>
    <text x="1060" y="195" text-anchor="middle" fill="#fef3c7" font-size="11">AS 65100 | ID: 10.0.0.2</text>
    <line x1="975" y1="205" x2="1145" y2="205" stroke="#d97706" stroke-width="1"/>
    <text x="975" y="222" fill="#ffffff" font-size="10">• Lo0: 10.0.0.2/32 (Mgmt)</text>
    <text x="975" y="238" fill="#ffffff" font-size="10">• eBGP: ISP-B (AS 65531)</text>
    <text x="975" y="254" fill="#ffffff" font-size="10">• iBGP: core-02, core-04</text>
  </g>


  <!-- LAYER 2: CORE ROUTERS -->
  <g id="core-01" filter="url(#shadow)">
    <rect x="90" y="390" width="200" height="110" rx="8" fill="url(#core-a-grad)"/>
    <text x="190" y="415" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-cor-01</text>
    <text x="190" y="433" text-anchor="middle" fill="#fca5a5" font-size="11">AS 65100 | ID: 10.1.0.1</text>
    <line x1="105" y1="443" x2="275" y2="443" stroke="#b91c1c" stroke-width="1"/>
    <text x="105" y="460" fill="#ffffff" font-size="10">• Lo0: 10.1.0.1/32</text>
    <text x="105" y="476" fill="#ffffff" font-size="10">• P2P /31 Underlay to agg-01</text>
  </g>

  <g id="core-02" filter="url(#shadow)">
    <rect x="960" y="390" width="200" height="110" rx="8" fill="url(#core-b-grad)"/>
    <text x="1060" y="415" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-cor-02</text>
    <text x="1060" y="433" text-anchor="middle" fill="#93c5fd" font-size="11">AS 65100 | ID: 10.1.0.2</text>
    <line x1="975" y1="443" x2="1145" y2="443" stroke="#1d4ed8" stroke-width="1"/>
    <text x="975" y="460" fill="#ffffff" font-size="10">• Lo0: 10.1.0.2/32</text>
    <text x="975" y="476" fill="#ffffff" font-size="10">• P2P /31 Underlay to agg-02</text>
  </g>


  <!-- LAYER 3: AGGREGATION SWITCHES (PURE L3 TRANSIT) -->
  <g id="agg-01" filter="url(#shadow)">
    <rect x="90" y="600" width="200" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="190" y="625" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-agg-01</text>
    <text x="190" y="643" text-anchor="middle" fill="#cbd5e1" font-size="11">Role: aggregation-transit</text>
    <line x1="105" y1="653" x2="275" y2="653" stroke="#475569" stroke-width="1"/>
    <text x="105" y="670" fill="#ffffff" font-size="10">• Lo0: 10.2.0.1/32</text>
    <text x="105" y="686" fill="#e2e8f0" font-size="9" font-weight="600">Pure Underlay / No VTEP / No EVPN</text>
  </g>

  <g id="agg-02" filter="url(#shadow)">
    <rect x="960" y="600" width="200" height="110" rx="8" fill="url(#agg-grad)"/>
    <text x="1060" y="625" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">abc-hq-agg-02</text>
    <text x="1060" y="643" text-anchor="middle" fill="#cbd5e1" font-size="11">Role: aggregation-transit</text>
    <line x1="975" y1="653" x2="1145" y2="653" stroke="#475569" stroke-width="1"/>
    <text x="975" y="670" fill="#ffffff" font-size="10">• Lo0: 10.2.0.2/32</text>
    <text x="975" y="686" fill="#e2e8f0" font-size="9" font-weight="600">Pure Underlay / No VTEP / No EVPN</text>
  </g>


  <!-- LAYER 4: ACCESS VTEPS (FLOOR 1) -->
  <g id="acc-01" filter="url(#shadow)">
    <rect x="55" y="810" width="200" height="155" rx="8" fill="url(#vtep-a-grad)"/>
    <text x="155" y="835" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-01</text>
    <text x="155" y="853" text-anchor="middle" fill="#fecdd3" font-size="10">Role: access-vtep (Floor 1)</text>
    <line x1="70" y1="863" x2="240" y2="863" stroke="#9f1239" stroke-width="1"/>
    <text x="70" y="880" fill="#ffffff" font-size="10">• Lo0 (Mgmt): 10.3.0.1/32</text>
    <text x="70" y="896" fill="#ffffff" font-size="10">• Lo1 (VTEP): 10.128.1.1/32</text>
    <text x="70" y="912" fill="#fecdd3" font-size="9">• NVE1 / BGP EVPN Active</text>
    <text x="70" y="928" fill="#fecdd3" font-size="9">• P2P Underlay to agg-01</text>
    <text x="70" y="944" fill="#fecdd3" font-size="9">• Cross-plane P2P to agg-02</text>
  </g>

  <g id="acc-02" filter="url(#shadow)">
    <rect x="385" y="810" width="200" height="155" rx="8" fill="url(#vtep-a-grad)"/>
    <text x="485" y="835" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-02</text>
    <text x="485" y="853" text-anchor="middle" fill="#fecdd3" font-size="10">Role: access-vtep (Floor 1)</text>
    <line x1="400" y1="863" x2="570" y2="863" stroke="#9f1239" stroke-width="1"/>
    <text x="400" y="880" fill="#ffffff" font-size="10">• Lo0 (Mgmt): 10.3.0.2/32</text>
    <text x="400" y="896" fill="#ffffff" font-size="10">• Lo1 (VTEP): 10.128.1.2/32</text>
    <text x="400" y="912" fill="#fecdd3" font-size="9">• NVE1 / BGP EVPN Active</text>
    <text x="400" y="928" fill="#fecdd3" font-size="9">• P2P Underlay to agg-03</text>
    <text x="400" y="944" fill="#fecdd3" font-size="9">• Cross-plane P2P to agg-04</text>
  </g>

  <g id="acc-03" filter="url(#shadow)">
    <rect x="665" y="810" width="200" height="155" rx="8" fill="url(#vtep-b-grad)"/>
    <text x="765" y="835" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-03</text>
    <text x="765" y="853" text-anchor="middle" fill="#e0f2fe" font-size="10">Role: access-vtep (Floor 1)</text>
    <line x1="680" y1="863" x2="850" y2="863" stroke="#0284c7" stroke-width="1"/>
    <text x="680" y="880" fill="#ffffff" font-size="10">• Lo0 (Mgmt): 10.3.0.3/32</text>
    <text x="680" y="896" fill="#ffffff" font-size="10">• Lo1 (VTEP): 10.128.1.3/32</text>
    <text x="680" y="912" fill="#e0f2fe" font-size="9">• NVE1 / BGP EVPN Active</text>
    <text x="680" y="928" fill="#e0f2fe" font-size="9">• P2P Underlay to agg-03</text>
    <text x="680" y="944" fill="#e0f2fe" font-size="9">• Cross-plane P2P to agg-02</text>
  </g>

  <g id="acc-04" filter="url(#shadow)">
    <rect x="995" y="810" width="200" height="155" rx="8" fill="url(#vtep-b-grad)"/>
    <text x="1095" y="835" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-04</text>
    <text x="1095" y="853" text-anchor="middle" fill="#e0f2fe" font-size="10">Role: access-vtep (Floor 1)</text>
    <line x1="1010" y1="863" x2="1180" y2="863" stroke="#0284c7" stroke-width="1"/>
    <text x="1010" y="880" fill="#ffffff" font-size="10">• Lo0 (Mgmt): 10.3.0.4/32</text>
    <text x="1010" y="896" fill="#ffffff" font-size="10">• Lo1 (VTEP): 10.128.1.4/32</text>
    <text x="1010" y="912" fill="#e0f2fe" font-size="9">• NVE1 / BGP EVPN Active</text>
    <text x="1010" y="928" fill="#e0f2fe" font-size="9">• P2P Underlay to agg-04</text>
    <text x="1010" y="944" fill="#e0f2fe" font-size="9">• Cross-plane P2P to agg-01</text>
  </g>


  <!-- ==================== VXLAN VNI MAPPINGS CARD ==================== -->
  <g transform="translate(40, 1015)" filter="url(#shadow)">
    <rect x="0" y="0" width="1170" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="700">EVPN OVERLAY VNI SERVICE MAPPINGS (Access Tier Termination)</text>
    
    <!-- Table Header Line -->
    <line x1="25" y1="42" x2="1145" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Column 1 -->
    <rect x="35" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="50" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 10 | VLAN 10</text>
    <text x="50" y="93" fill="#f8fafc" font-size="11" font-weight="600">Campus_Users</text>
    <text x="50" y="108" fill="#94a3b8" font-size="9">Primary user network segment</text>

    <!-- Column 2 -->
    <rect x="257" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="272" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 20 | VLAN 20</text>
    <text x="272" y="93" fill="#f8fafc" font-size="11" font-weight="600">Security_Cameras</text>
    <text x="272" y="108" fill="#94a3b8" font-size="9">IoT/OT segment for cameras</text>

    <!-- Column 3 -->
    <rect x="479" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="494" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 30 | VLAN 30</text>
    <text x="494" y="93" fill="#f8fafc" font-size="11" font-weight="600">Voice_VoIP</text>
    <text x="494" y="108" fill="#94a3b8" font-size="9">IP Telephony &amp; VoIP segment</text>

    <!-- Column 4 -->
    <rect x="701" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="716" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 40 | VLAN 40</text>
    <text x="716" y="93" fill="#f8fafc" font-size="11" font-weight="600">Wireless_AP_Mgmt</text>
    <text x="716" y="108" fill="#94a3b8" font-size="9">CAPWAP mgmt infrastructure</text>

    <!-- Column 5 -->
    <rect x="923" y="55" width="210" height="62" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="938" y="75" fill="#f43f5e" font-size="11" font-weight="700">VNI 50 / 999</text>
    <text x="938" y="93" fill="#f8fafc" font-size="11" font-weight="600">IPTV &amp; Critical Services</text>
    <text x="938" y="108" fill="#94a3b8" font-size="9">Multicast &amp; fallback segments</text>
  </g>


  <!-- ==================== LEGEND PANEL ==================== -->
  <g transform="translate(40, 1175)" filter="url(#shadow)">
    <rect x="0" y="0" width="1170" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="38" fill="#f8fafc" font-size="12" font-weight="700">TOPOLOGY LEGEND:</text>

    <!-- Legend Items -->
    <line x1="170" y1="34" x2="220" y2="34" stroke="#10b981" stroke-width="3"/>
    <text x="230" y="38" fill="#94a3b8" font-size="11">iBGP Underlay P2P Link (/31)</text>

    <line x1="430" y1="34" x2="480" y2="34" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="490" y="38" fill="#94a3b8" font-size="11">eBGP / Core Interconnect</text>

    <line x1="700" y1="34" x2="750" y2="34" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="760" y="38" fill="#94a3b8" font-size="11">VXLAN EVPN Overlay Tunnel (NVE1)</text>

    <line x1="1000" y1="34" x2="1050" y2="34" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="1060" y="38" fill="#94a3b8" font-size="11">Cross-Plane Underlay</text>
  </g>

</svg>
