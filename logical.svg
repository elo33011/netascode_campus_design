<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1120" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="fda-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="fdb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="node-wan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="node-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="node-agg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="node-acc-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="node-acc-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="575" y="25" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">ABC HQ — CAMPUS LOGICAL BGP TOPOLOGY</text>
  <text x="575" y="45" text-anchor="middle" fill="#94a3b8" font-size="13">Dual Failure-Domain iBGP Mesh (FD-A / FD-B) · Unified AS 65100 · eBGP Edge to Providers · VXLAN EVPN Access Overlay</text>

  <!-- FAILURE DOMAIN BACKGROUND CONTAINERS -->
  <rect x="50" y="90" width="500" height="780" rx="16" fill="url(#fda-grad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="70" y="105" width="180" height="30" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="80" y="125" fill="#fca5a5" font-size="14" font-weight="700">FAILURE DOMAIN A</text>

  <rect x="600" y="90" width="500" height="780" rx="16" fill="url(#fdb-grad)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="620" y="105" width="180" height="30" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="630" y="125" fill="#93c5fd" font-size="14" font-weight="700">FAILURE DOMAIN B</text>

  <!-- EXTERNAL WAN PEERS — eBGP sessions (single colour, dotted) -->
  <path d="M 165,75 L 165,160" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
  <rect x="85" y="58" width="160" height="24" rx="4" fill="#b45309"/>
  <text x="165" y="74" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Provider A — AS 65530</text>

  <path d="M 915,75 L 915,160" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
  <rect x="835" y="58" width="160" height="24" rx="4" fill="#b45309"/>
  <text x="915" y="74" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Provider B — AS 65531</text>

  <!-- ALL iBGP SESSIONS BELOW — single colour, dotted (logical, not physical cabling) -->
  <g id="ibgp-sessions" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" fill="none">
    <!-- wan <-> core (direct, same failure domain) -->
    <path d="M 165,210 L 165,300"/>
    <path d="M 915,210 L 915,300"/>
    <!-- wan <-> core (cross failure domain — redundant path) -->
    <path d="M 185,210 L 725,300"/>
    <path d="M 895,210 L 355,300"/>
    <!-- core <-> core (intra failure domain) -->
    <path d="M 239,325 L 261,325"/>
    <path d="M 819,325 L 841,325"/>
    <!-- core <-> agg full mesh, each failure domain -->
    <path d="M 165,350 L 165,460"/>
    <path d="M 165,350 L 335,460"/>
    <path d="M 335,350 L 165,460"/>
    <path d="M 335,350 L 335,460"/>
    <path d="M 745,350 L 745,460"/>
    <path d="M 745,350 L 915,460"/>
    <path d="M 915,350 L 745,460"/>
    <path d="M 915,350 L 915,460"/>
    <!-- agg <-> agg (intra failure domain) -->
    <path d="M 239,485 L 261,485"/>
    <path d="M 819,485 L 841,485"/>
    <!-- agg <-> access-vtep, floor 1 (both aggregation parents peer the vtep) -->
    <path d="M 165,510 L 310,595"/>
    <path d="M 335,510 L 310,595"/>
    <path d="M 745,510 L 840,595"/>
    <path d="M 915,510 L 840,595"/>
    <!-- agg <-> access-vtep, floor 10 (same pattern repeats through floors 02-09) -->
    <path d="M 165,510 L 310,765" stroke-opacity="0.55"/>
    <path d="M 335,510 L 310,765" stroke-opacity="0.55"/>
    <path d="M 745,510 L 840,765" stroke-opacity="0.55"/>
    <path d="M 915,510 L 840,765" stroke-opacity="0.55"/>
  </g>

  <!-- NODES -->
  <g id="wan-routers" filter="url(#shadow)">
    <rect x="91" y="160" width="148" height="50" rx="8" fill="url(#node-wan)"/>
    <text x="165" y="180" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-01</text>
    <text x="165" y="195" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-A · AS 65100</text>
    <text x="165" y="208" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.0.0.1/32</text>
    <rect x="841" y="160" width="148" height="50" rx="8" fill="url(#node-wan)"/>
    <text x="915" y="180" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-02</text>
    <text x="915" y="195" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-B · AS 65100</text>
    <text x="915" y="208" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.0.0.2/32</text>
  </g>

  <g id="core-routers" filter="url(#shadow)">
    <rect x="91" y="300" width="148" height="50" rx="8" fill="url(#node-core)"/>
    <text x="165" y="320" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-01</text>
    <text x="165" y="335" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-A · core</text>
    <text x="165" y="348" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.1.0.1/32</text>
    <rect x="261" y="300" width="148" height="50" rx="8" fill="url(#node-core)"/>
    <text x="335" y="320" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-02</text>
    <text x="335" y="335" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-A · core</text>
    <text x="335" y="348" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.1.0.2/32</text>
    <rect x="671" y="300" width="148" height="50" rx="8" fill="url(#node-core)"/>
    <text x="745" y="320" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-03</text>
    <text x="745" y="335" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-B · core</text>
    <text x="745" y="348" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.1.0.3/32</text>
    <rect x="841" y="300" width="148" height="50" rx="8" fill="url(#node-core)"/>
    <text x="915" y="320" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-04</text>
    <text x="915" y="335" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-B · core</text>
    <text x="915" y="348" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.1.0.4/32</text>
  </g>

  <g id="agg-switches" filter="url(#shadow)">
    <rect x="91" y="460" width="148" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="165" y="480" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-01</text>
    <text x="165" y="495" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-A · agg-transit</text>
    <text x="165" y="508" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.2.0.1/32</text>
    <rect x="261" y="460" width="148" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="335" y="480" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-02</text>
    <text x="335" y="495" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-A · agg-transit</text>
    <text x="335" y="508" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.2.0.2/32</text>
    <rect x="671" y="460" width="148" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="745" y="480" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-03</text>
    <text x="745" y="495" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-B · agg-transit</text>
    <text x="745" y="508" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.2.0.3/32</text>
    <rect x="841" y="460" width="148" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="915" y="480" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-04</text>
    <text x="915" y="495" text-anchor="middle" fill="#e2e8f0" font-size="9.5">FD-B · agg-transit</text>
    <text x="915" y="508" text-anchor="middle" fill="#e2e8f0" font-size="9.5">Lo0 10.2.0.4/32</text>
  </g>

  <!-- FLOOR 1 -->
  <rect x="70" y="580" width="1010" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="85" y="625" fill="#f8fafc" font-size="14" font-weight="700">FLOOR 01</text>
  <g id="f01-switches" filter="url(#shadow)">
    <rect x="200" y="595" width="220" height="50" rx="8" fill="url(#node-acc-a)"/>
    <text x="310" y="614" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-01</text>
    <text x="310" y="628" text-anchor="middle" fill="#fee2e2" font-size="9.5">FD-A · access-vtep</text>
    <text x="310" y="640" text-anchor="middle" fill="#fee2e2" font-size="9.5">Lo1 10.128.1.1/32 (VTEP src)</text>

    <rect x="730" y="595" width="220" height="50" rx="8" fill="url(#node-acc-b)"/>
    <text x="840" y="614" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-02</text>
    <text x="840" y="628" text-anchor="middle" fill="#dbeafe" font-size="9.5">FD-B · access-vtep</text>
    <text x="840" y="640" text-anchor="middle" fill="#dbeafe" font-size="9.5">Lo1 10.128.1.2/32 (VTEP src)</text>
  </g>

  <!-- FLOORS 2-9: pattern repeats, no per-device data in the source schema -->
  <g transform="translate(0, 675)">
    <line x1="70" y1="20" x2="1080" y2="20" stroke="#475569" stroke-width="2"/>
    <rect x="435" y="5" width="280" height="30" rx="15" fill="#334155"/>
    <text x="575" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">⋮ FLOORS 02–09 (SAME PATTERN) ⋮</text>
  </g>

  <!-- FLOOR 10 (representative — device-level data not provided beyond floor 1) -->
  <rect x="70" y="750" width="1010" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-opacity="0.7"/>
  <text x="85" y="795" fill="#cbd5e1" font-size="14" font-weight="700">FLOOR 10</text>
  <g id="f10-switches" filter="url(#shadow)" opacity="0.75">
    <rect x="200" y="765" width="220" height="50" rx="8" fill="url(#node-acc-a)"/>
    <text x="310" y="784" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f10-acc-01</text>
    <text x="310" y="800" text-anchor="middle" fill="#fee2e2" font-size="9.5">FD-A · access-vtep</text>

    <rect x="730" y="765" width="220" height="50" rx="8" fill="url(#node-acc-b)"/>
    <text x="840" y="784" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f10-acc-02</text>
    <text x="840" y="800" text-anchor="middle" fill="#dbeafe" font-size="9.5">FD-B · access-vtep</text>
  </g>

  <!-- VXLAN EVPN OVERLAY BANNER -->
  <g transform="translate(0, 845)">
    <line x1="70" y1="14" x2="1080" y2="14" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="1 6" stroke-linecap="round"/>
    <rect x="365" y="0" width="420" height="28" rx="14" fill="#3b0764"/>
    <text x="575" y="19" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="600">VXLAN EVPN OVERLAY — NVE1 / Lo1 VTEP SOURCE (PER-FLOOR ACCESS PAIR)</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(200, 900)" filter="url(#shadow)">
    <rect x="0" y="0" width="750" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">LEGEND:</text>

    <line x1="100" y1="26" x2="145" y2="26" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="153" y="30" fill="#94a3b8" font-size="11">eBGP session</text>

    <line x1="315" y1="26" x2="360" y2="26" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="368" y="30" fill="#94a3b8" font-size="11">iBGP session</text>

    <line x1="530" y1="26" x2="575" y2="26" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="583" y="30" fill="#94a3b8" font-size="11">VXLAN EVPN overlay tunnel</text>
  </g>

  <!-- SERVICE OVERLAY: VNI / VLAN MAPPING -->
  <g transform="translate(70, 965)">
    <rect x="0" y="0" width="1010" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#f8fafc" font-size="12" font-weight="700">SERVICE OVERLAY — VNI / VLAN MAPPING</text>

    <circle cx="30" cy="46" r="4" fill="#14b8a6"/>
    <text x="42" y="50" fill="#e2e8f0" font-size="10.5">VNI 10 · Campus_Users</text>
    <circle cx="30" cy="70" r="4" fill="#f43f5e"/>
    <text x="42" y="74" fill="#e2e8f0" font-size="10.5">VNI 20 · Security_Cameras</text>

    <circle cx="270" cy="46" r="4" fill="#eab308"/>
    <text x="282" y="50" fill="#e2e8f0" font-size="10.5">VNI 30 · Voice_VoIP</text>
    <circle cx="270" cy="70" r="4" fill="#6366f1"/>
    <text x="282" y="74" fill="#e2e8f0" font-size="10.5">VNI 40 · Wireless_AP_Mgmt</text>

    <circle cx="560" cy="46" r="4" fill="#ec4899"/>
    <text x="572" y="50" fill="#e2e8f0" font-size="10.5">VNI 50 · IPTV_Multicast</text>
    <circle cx="560" cy="70" r="4" fill="#64748b"/>
    <text x="572" y="74" fill="#e2e8f0" font-size="10.5">VNI 999 · Critical_Services (fallback)</text>

    <text x="810" y="50" fill="#64748b" font-size="9.5">NVE Interface</text>
    <text x="810" y="64" fill="#e2e8f0" font-size="11" font-weight="600">NVE1</text>
    <text x="920" y="50" fill="#64748b" font-size="9.5">VTEP Source</text>
    <text x="920" y="64" fill="#e2e8f0" font-size="11" font-weight="600">Loopback1</text>
  </g>

  <!-- BGP AS SCHEMA -->
  <g transform="translate(70, 1075)">
    <rect x="0" y="0" width="1010" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="22" fill="#94a3b8" font-size="10.5" font-weight="700">BGP AS SCHEMA:</text>
    <circle cx="185" cy="17" r="4" fill="#38bdf8"/>
    <text x="196" y="21" fill="#e2e8f0" font-size="10.5">AS 65100 — Campus Unified (WAN·Core·Agg·Access)</text>
    <circle cx="620" cy="17" r="4" fill="#f59e0b"/>
    <text x="631" y="21" fill="#e2e8f0" font-size="10.5">AS 65530 — Provider A</text>
    <circle cx="825" cy="17" r="4" fill="#f59e0b"/>
    <text x="836" y="21" fill="#e2e8f0" font-size="10.5">AS 65531 — Provider B</text>
  </g>
</svg>
