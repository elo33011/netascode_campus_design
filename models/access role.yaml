# ============================================================================
# PLATFORM BASELINE DATA MODEL: ACCESS SWITCH (Vendor-Agnostic)
# ============================================================================
platform_access_baseline:
  management_plane:
    banner_login: "Authorized Use Only. System activity is logged."
    ssh_version: "2"
    console_timeout_minutes: 10
    vty_timeout_minutes: 15
    login_retries: 3
    dns:
      domain_name: "campus.example.net"
      source_interface: "Loopback0"
    http_services:
      enable: false
      secure_only: true
    ntp:
      servers: ["10.254.1.10", "10.254.1.11"]   # DEMO value -- reuses the same OOB time source as platform_wan_baseline.yaml; no separate value was ever supplied for this platform
      source_interface: "Loopback0"
    syslog:
      servers: ["10.254.1.30", "10.254.1.31"]     # DEMO values -- example syslog collectors on the OOB mgmt range, not real servers
      source_interface: "Loopback0"
      severity_level: "informational"             # DEMO value -- level 6, a common baseline "log everything but debugging" default
    snmp:
      enabled: true
      contact: "netops@campus.example.net"       # DEMO value -- reuses platform_wan_baseline.yaml's value; no separate value was ever supplied for this platform
      location: "abc-hq"                         # DEMO value
      community_strings: ["CAMPUS-MONITORING-RO"] # DEMO value -- placeholder name, not "public"; replace with a real, generated string before deploying
      trap_destinations: ["10.254.1.20"]          # DEMO value -- example NMS host on the OOB mgmt range
    tacacs:
      servers: ["10.254.1.40", "10.254.1.41"]     # DEMO values -- example TACACS+ servers on the OOB mgmt range, not real servers
      source_interface: "Loopback0"
      encryption_key: "DEMO-TACACS-KEY-CHANGE-ME"  # DEMO value -- a real key belongs in ansible-vault / an environment variable, never committed in plaintext
  infrastructure_protection:
    icmp_standards:
      unreachable_rate_limit: 100
      accept_redirects: false
      mask_requests: false
    disabled_ip_services:
      - "ip_source_routing"
      - "proxy_arp"
    ipv6_hardening:
      ra_suppress: true
  endpoint_access_security:
    dot1x_authentication:
      enable: true
      host_mode: "multi-domain"
      fallback_mechanism:
        enabled: true
        restricted_vlan: 998
        reinitialize_timer_seconds: 300
    port_security:
      enable: true
      max_mac_addresses_per_port: 2
      violation_action: "protect"
    dhcp_snooping:
      enable: true
      trust_uplinks_to_transit: true
    dynamic_arp_inspection:
      enable: true
    storm_control:
      broadcast_pps: 500
      multicast_pps: 500
      action: "trap_and_log"
  routing_baseline:
    control_plane_policing:
      enable: true
      protocols:
        routing_updates: "medium"
        management_access: "low"
        transit_traffic: "high"
  hardware_integrity:
    secure_boot_verification: true
    environmental_monitoring: true
  interface_baseline:
    unused_edge_ports:
      mode: "access"
      default_vlan: 999
      shutdown: true
    underlay_uplinks:
      link_aggregation:
        protocol: "lacp"
        mode: "active"
