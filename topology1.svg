<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 980" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fda-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="fdb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="node-wan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="node-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="node-agg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="node-acc-a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="node-acc-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TITLE -->
  <text x="575" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">ABC HQ - CAMPUS PHYSICAL TOPOLOGY SCHEMA</text>
  <text x="575" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Dual Failure Domain Architecture (FD-A / FD-B) with Full WAN-to-Core Cross-Connect Matrix</text>

  <!-- FAILURE DOMAIN BACKGROUND CONTAINERS -->
  <!-- Domain A (Red) -->
  <rect x="50" y="90" width="500" height="780" rx="16" fill="url(#fda-grad)" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="70" y="105" width="220" height="30" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="80" y="125" fill="#fca5a5" font-size="14" font-weight="700">FAILURE DOMAIN A (Red)</text>

  <!-- Domain B (Blue) -->
  <rect x="600" y="90" width="500" height="780" rx="16" fill="url(#fdb-grad)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="620" y="105" width="220" height="30" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="630" y="125" fill="#93c5fd" font-size="14" font-weight="700">FAILURE DOMAIN B (Blue)</text>

  <!-- EXTERNAL WAN LINES -->
  <path d="M 165,30 L 165,160" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <rect x="95" y="30" width="140" height="22" rx="4" fill="#b45309"/>
  <text x="165" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Provider A (10Gbps)</text>

  <path d="M 915,30 L 915,160" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <rect x="845" y="30" width="140" height="22" rx="4" fill="#b45309"/>
  <text x="915" y="45" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Provider B (10Gbps)</text>

  <!-- LINKS LAYER -->
  
  <!-- Inter-Device 100G Horizontal Links -->
  <!-- WAN to WAN (100G) -->
  <path d="M 230,185 L 850,185" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Core Horizontal Intra-FD Mesh -->
  <path d="M 230,325 L 270,325" stroke="#38bdf8" stroke-width="3"/> <!-- Cor-01 to Cor-02 -->
  <path d="M 810,325 L 850,325" stroke="#38bdf8" stroke-width="3"/> <!-- Cor-03 to Cor-04 -->

  <!-- Agg 100G Links -->
  <path d="M 230,485 L 270,485" stroke="#38bdf8" stroke-width="3"/> <!-- Agg-01 to Agg-02 -->
  <path d="M 810,485 L 850,485" stroke="#38bdf8" stroke-width="3"/> <!-- Agg-03 to Agg-04 -->

  <!-- WAN TO CORE FULL CROSS-CONNECT MATRIX (100G) -->
  <!-- WAN-01 (FD-A) Connections -->
  <path d="M 165,210 L 165,300" stroke="#38bdf8" stroke-width="2.5"/> <!-- WAN-01 -> Cor-01 (FD-A) -->
  <path d="M 185,210 L 745,300" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,3"/> <!-- WAN-01 -> Cor-03 (FD-B Cross) -->

  <!-- WAN-02 (FD-B) Connections -->
  <path d="M 915,210 L 915,300" stroke="#38bdf8" stroke-width="2.5"/> <!-- WAN-02 -> Cor-04 (FD-B) -->
  <path d="M 895,210 L 335,300" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,3"/> <!-- WAN-02 -> Cor-02 (FD-A Cross) -->

  <!-- Core to Agg (FD-A) -->
  <path d="M 165,350 L 165,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 165,350 L 335,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 335,350 L 165,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 335,350 L 335,460" stroke="#38bdf8" stroke-width="3"/>

  <!-- Core to Agg (FD-B) -->
  <path d="M 745,350 L 745,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 745,350 L 915,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 915,350 L 745,460" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 915,350 L 915,460" stroke="#38bdf8" stroke-width="3"/>

  <!-- Agg to Access (10G Fiber Links) -->
  <!-- Floor 1 -->
  <path d="M 165,510 L 310,595" stroke="#10b981" stroke-width="2"/>
  <path d="M 335,510 L 310,595" stroke="#10b981" stroke-width="2"/>
  <path d="M 745,510 L 840,595" stroke="#10b981" stroke-width="2"/>
  <path d="M 915,510 L 840,595" stroke="#10b981" stroke-width="2"/>

  <!-- Floor 10 -->
  <path d="M 165,510 L 310,765" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 335,510 L 310,765" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 745,510 L 840,765" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 915,510 L 840,765" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- NODES LAYER -->

  <!-- LAYER 1: WAN ROUTERS -->
  <g id="wan-routers" filter="url(#shadow)">
    <!-- WAN-01 (Aligned horizontally with Agg-01 at x=100) -->
    <rect x="100" y="160" width="130" height="50" rx="8" fill="url(#node-wan)"/>
    <text x="165" y="183" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-01</text>
    <text x="165" y="198" text-anchor="middle" fill="#e0f2fe" font-size="10">Role: WAN Edge</text>

    <!-- WAN-02 (Aligned horizontally with Agg-04 at x=850) -->
    <rect x="850" y="160" width="130" height="50" rx="8" fill="url(#node-wan)"/>
    <text x="915" y="183" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-wan-02</text>
    <text x="915" y="198" text-anchor="middle" fill="#e0f2fe" font-size="10">Role: WAN Edge</text>
  </g>

  <!-- LAYER 2: CORE ROUTERS -->
  <g id="core-routers" filter="url(#shadow)">
    <!-- Cor-01 -->
    <rect x="100" y="300" width="130" height="50" rx="8" fill="url(#node-core)"/>
    <text x="165" y="323" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-01</text>
    <text x="165" y="338" text-anchor="middle" fill="#f3e8ff" font-size="10">Core Router</text>

    <!-- Cor-02 -->
    <rect x="270" y="300" width="130" height="50" rx="8" fill="url(#node-core)"/>
    <text x="335" y="323" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-02</text>
    <text x="335" y="338" text-anchor="middle" fill="#f3e8ff" font-size="10">Core Router</text>

    <!-- Cor-03 -->
    <rect x="680" y="300" width="130" height="50" rx="8" fill="url(#node-core)"/>
    <text x="745" y="323" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-03</text>
    <text x="745" y="338" text-anchor="middle" fill="#f3e8ff" font-size="10">Core Router</text>

    <!-- Cor-04 -->
    <rect x="850" y="300" width="130" height="50" rx="8" fill="url(#node-core)"/>
    <text x="915" y="323" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-cor-04</text>
    <text x="915" y="338" text-anchor="middle" fill="#f3e8ff" font-size="10">Core Router</text>
  </g>

  <!-- LAYER 3: AGGREGATION SWITCHES -->
  <g id="agg-switches" filter="url(#shadow)">
    <!-- Agg-01 -->
    <rect x="100" y="460" width="130" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="165" y="483" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-01</text>
    <text x="165" y="498" text-anchor="middle" fill="#fef3c7" font-size="10">Agg / VTEP</text>

    <!-- Agg-02 -->
    <rect x="270" y="460" width="130" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="335" y="483" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-02</text>
    <text x="335" y="498" text-anchor="middle" fill="#fef3c7" font-size="10">Agg / VTEP</text>

    <!-- Agg-03 -->
    <rect x="680" y="460" width="130" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="745" y="483" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-03</text>
    <text x="745" y="498" text-anchor="middle" fill="#fef3c7" font-size="10">Agg / VTEP</text>

    <!-- Agg-04 -->
    <rect x="850" y="460" width="130" height="50" rx="8" fill="url(#node-agg)"/>
    <text x="915" y="483" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-agg-04</text>
    <text x="915" y="498" text-anchor="middle" fill="#fef3c7" font-size="10">Agg / VTEP</text>
  </g>

  <!-- LAYER 4: ACCESS SWITCHES (FLOORS 1 to 10) -->
  
  <!-- FLOOR 1 -->
  <rect x="70" y="580" width="1010" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="85" y="625" fill="#f8fafc" font-size="14" font-weight="700">FLOOR 01</text>

  <g id="f01-switches" filter="url(#shadow)">
    <!-- f01-acc-01 -->
    <rect x="200" y="595" width="220" height="50" rx="8" fill="url(#node-acc-a)"/>
    <text x="310" y="618" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-01</text>
    <text x="310" y="633" text-anchor="middle" fill="#fee2e2" font-size="10">IDF-1A | 802.1X Auth</text>

    <!-- f01-acc-02 -->
    <rect x="730" y="595" width="220" height="50" rx="8" fill="url(#node-acc-b)"/>
    <text x="840" y="618" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f01-acc-02</text>
    <text x="840" y="633" text-anchor="middle" fill="#dbeafe" font-size="10">IDF-1B | 802.1X Auth</text>
  </g>

  <!-- FLOORS 2-9 BREAK INDICATOR -->
  <g transform="translate(0, 675)">
    <line x1="70" y1="20" x2="1080" y2="20" stroke="#475569" stroke-width="2" stroke-dasharray="8,8"/>
    <rect x="475" y="5" width="200" height="30" rx="15" fill="#334155"/>
    <text x="575" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">... FLOORS 02 THROUGH 09 ...</text>
  </g>

  <!-- FLOOR 10 -->
  <rect x="70" y="750" width="1010" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="85" y="795" fill="#f8fafc" font-size="14" font-weight="700">FLOOR 10</text>

  <g id="f10-switches" filter="url(#shadow)">
    <!-- f10-acc-01 -->
    <rect x="200" y="765" width="220" height="50" rx="8" fill="url(#node-acc-a)"/>
    <text x="310" y="788" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f10-acc-01</text>
    <text x="310" y="803" text-anchor="middle" fill="#fee2e2" font-size="10">IDF-10A | 802.1X Auth</text>

    <!-- f10-acc-02 -->
    <rect x="730" y="765" width="220" height="50" rx="8" fill="url(#node-acc-b)"/>
    <text x="840" y="788" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">abc-hq-f10-acc-02</text>
    <text x="840" y="803" text-anchor="middle" fill="#dbeafe" font-size="10">IDF-10B | 802.1X Auth</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(180, 900)" filter="url(#shadow)">
    <rect x="0" y="0" width="790" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">LEGEND:</text>
    
    <line x1="100" y1="26" x2="140" y2="26" stroke="#38bdf8" stroke-width="3"/>
    <text x="150" y="30" fill="#94a3b8" font-size="11">100G Inter-Device / Intra-FD Links</text>

    <line x1="360" y1="26" x2="400" y2="26" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="410" y="30" fill="#94a3b8" font-size="11">100G Cross-FD WAN-Core Link</text>

    <line x1="610" y1="26" x2="650" y2="26" stroke="#10b981" stroke-width="2"/>
    <text x="660" y="30" fill="#94a3b8" font-size="11">10G Agg-to-Access</text>
  </g>
</svg>
