  <text x="250" y="500" text-anchor="middle" fill="#7dd3fc" font-size="7.5" font-family="ui-monospace, Menlo, monospace">Hu0/48 10.15.0.0/31↔10.15.0.1/31</text>
  <path d="M 810,485 L 850,485" stroke="#38bdf8" stroke-width="3"/>
  <text x="830" y="500" text-anchor="middle" fill="#7dd3fc" font-size="7.5" font-family="ui-monospace, Menlo, monospace">Hu0/48 10.15.2.0/31↔10.15.2.1/31</text>

