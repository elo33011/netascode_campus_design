<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <title>abc-hq campus design — data model relationships</title>
  <desc>Physical topology fills logical topology's WAN-router interface/IP gap; logical topology's VNI-to-VLAN catalog is endpoint service's single source of truth; a shared hostname naming convention and the filter_plugins layer tie all three together before templates render per-device config.</desc>

  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="600" y="30" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700" letter-spacing="0.5">ABC-HQ CAMPUS — DATA MODEL RELATIONSHIPS</text>
  <text x="600" y="52" text-anchor="middle" fill="#94a3b8" font-size="12.5">Where the three models fill each other's gaps, and where the filter layer resolves the references</text>

  <!-- ================= ROW 1: the three models ================= -->

  <!-- Box A: physical topology.yaml -->
  <rect x="50" y="90" width="300" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="90" width="300" height="6" rx="3" fill="#38bdf8"/>
  <text x="66" y="120" fill="#38bdf8" font-size="15" font-weight="700">physical topology.yaml</text>
  <line x1="66" y1="132" x2="334" y2="132" stroke="#334155" stroke-width="1"/>
  <text x="66" y="152" fill="#cbd5e1" font-size="12">Layer 1/2 — devices, ports,</text>
  <text x="66" y="172" fill="#cbd5e1" font-size="12">cabling, failure domains</text>
  <text x="66" y="192" fill="#cbd5e1" font-size="12">(FD-A / FD-B), rack inventory</text>

  <!-- Box B: logical topology.yaml -->
  <rect x="450" y="90" width="300" height="150" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="450" y="90" width="300" height="6" rx="3" fill="#34d399"/>
  <text x="466" y="120" fill="#34d399" font-size="15" font-weight="700">logical topology.yaml</text>
  <line x1="466" y1="132" x2="734" y2="132" stroke="#334155" stroke-width="1"/>
  <text x="466" y="152" fill="#cbd5e1" font-size="12">Layer 3+ — loopbacks, BGP</text>
  <text x="466" y="172" fill="#cbd5e1" font-size="12">underlay, EVPN-VXLAN overlay,</text>
  <text x="466" y="192" fill="#cbd5e1" font-size="12">VNI ↔ VLAN catalog</text>

  <!-- Box C: endpoint service.yaml -->
  <rect x="850" y="90" width="300" height="150" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="850" y="90" width="300" height="6" rx="3" fill="#fbbf24"/>
  <text x="866" y="120" fill="#fbbf24" font-size="15" font-weight="700">endpoint service.yaml</text>
  <line x1="866" y1="132" x2="1134" y2="132" stroke="#334155" stroke-width="1"/>
  <text x="866" y="152" fill="#cbd5e1" font-size="12">BAU — per-port VLAN, voice</text>
  <text x="866" y="172" fill="#cbd5e1" font-size="12">VLAN, 802.1X/MAB, DHCP</text>
  <text x="866" y="192" fill="#cbd5e1" font-size="12">snooping — re-run independently</text>

  <!-- Arrow A -> B -->
  <line x1="350" y1="165" x2="450" y2="165" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="400" y="150" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">fills WAN link gaps</text>
  <text x="400" y="184" text-anchor="middle" fill="#94a3b8" font-size="9.5">wan_peer_binding()</text>
  <text x="400" y="197" text-anchor="middle" fill="#94a3b8" font-size="9.5">+ device_phys_links()</text>

  <!-- Arrow B -> C -->
  <line x1="750" y1="165" x2="850" y2="165" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="800" y="150" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">VLAN source of truth</text>
  <text x="800" y="184" text-anchor="middle" fill="#94a3b8" font-size="9.5">vni_service_mappings</text>
  <text x="800" y="197" text-anchor="middle" fill="#94a3b8" font-size="9.5">(VLAN IDs referenced)</text>

  <!-- ================= Cross-cutting: shared hostname convention ================= -->
  <line x1="200" y1="240" x2="200" y2="400" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="240" x2="600" y2="400" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="1000" y1="240" x2="1000" y2="400" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <line x1="140" y1="300" x2="1060" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,5"/>
  <circle cx="200" cy="300" r="3.5" fill="#64748b"/>
  <circle cx="600" cy="300" r="3.5" fill="#64748b"/>
  <circle cx="1000" cy="300" r="3.5" fill="#64748b"/>
  <text x="600" y="320" text-anchor="middle" fill="#94a3b8" font-size="10.5">shared hostname convention (-wan- / -cor- / -agg- / -acc-) → device_platform() / device_role()</text>

  <!-- ================= Filter resolution band ================= -->
  <rect x="50" y="400" width="1100" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="424" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">filter_plugins/netascode_filters.py — resolves cross-model references</text>
  <text x="200" y="452" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="600">device_phys_links()</text>
  <text x="600" y="452" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="600">device_routing_record() / find_ip_owner()</text>
  <text x="1000" y="452" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="600">endpoint_port_configs() / _select_override()</text>

  <!-- ================= Output ================= -->
  <line x1="600" y1="470" x2="600" y2="510" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <rect x="400" y="510" width="400" height="60" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="536" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">templates → rendered_configs/*.cfg</text>
  <text x="600" y="556" text-anchor="middle" fill="#94a3b8" font-size="10">physical topology.j2 → logical topology.j2 → endpoint service.j2</text>

  <!-- ================= Caption ================= -->
  <text x="600" y="605" text-anchor="middle" fill="#94a3b8" font-size="11.5">Physical topology fills logical topology's WAN-router gap · logical topology's VLAN catalog is endpoint service's single source of truth</text>
  <text x="600" y="623" text-anchor="middle" fill="#94a3b8" font-size="11.5">A shared hostname convention and this filter layer tie all three together before templates render per-device config</text>
</svg>
