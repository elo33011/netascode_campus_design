# ============================================================================
# Inventory for the abc-hq campus build (design.md / physical_topology.yaml)
# ============================================================================
# Groups exist to carry the one thing that MUST be known before Ansible can
# even connect: ansible_network_os. Everything else device-specific
# (platform, role, which baseline yaml/template applies) is derived at
# runtime in the playbooks via the device_platform / device_role filters in
# filter_plugins/netascode_filters.py, from the SAME hostname convention
# physical_topology.yaml and logical_topology.yaml already use -- so there
# is exactly one place (that filter file) that encodes "-wan- -> Catalyst
# 8000", not a second copy of that mapping duplicated into this inventory.
#
# FINDING -- ansible_host below is each device's Loopback0 ("management"
# type) address from logical_topology.yaml. That is deliberately NOT a
# day-0-safe choice: Loopback0 doesn't exist on a device until the LOGICAL
# TOPOLOGY stage (03_logical_topology.yml) configures it -- a brand new,
# factory-default device only has console/OOB reachability. Neither
# physical_topology.yaml nor physical_topology_management_network.yaml
# assigns a per-device OOB management IP anywhere (the OOB yaml maps
# console/mgmt PORTS to terminal-server/mgmt-switch ports, never an IP),
# so there is no data in this repo to build a real day-0 inventory from.
# This inventory is therefore only valid for BAU/re-run use against a
# fabric that has already completed at least one full build cycle (loopback
# already configured) -- exactly the "BAU change is fast, low-risk, and
# auditable" loop design.md describes, reusing the same templates. For an
# actual day-0 bring-up, replace ansible_host below with each device's real
# OOB IP once that gap in physical_topology_management_network.yaml is
# filled in.
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: "{{ lookup('env', 'ANSIBLE_NET_USERNAME') | default('CHANGE_ME', true) }}"
    ansible_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') | default('CHANGE_ME', true) }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ lookup('env', 'ANSIBLE_NET_ENABLE_PASSWORD') | default('CHANGE_ME', true) }}"
    # NOTE: real credentials belong in an ansible-vault-encrypted file (or
    # the environment variables above), never committed in plaintext here.
  children:
    wan_edge:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        abc-hq-wan-01:
          ansible_host: 10.0.0.1
        abc-hq-wan-02:
          ansible_host: 10.0.0.2
    core_agg:
      vars:
        ansible_network_os: cisco.nxos.nxos
      hosts:
        abc-hq-cor-01:
          ansible_host: 10.1.0.1
        abc-hq-cor-02:
          ansible_host: 10.1.0.2
        abc-hq-cor-03:
          ansible_host: 10.1.0.3
        abc-hq-cor-04:
          ansible_host: 10.1.0.4
        abc-hq-agg-01:
          ansible_host: 10.2.0.1
        abc-hq-agg-02:
          ansible_host: 10.2.0.2
        abc-hq-agg-03:
          ansible_host: 10.2.0.3
        abc-hq-agg-04:
          ansible_host: 10.2.0.4
    access:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        abc-hq-f01-acc-01:
          ansible_host: 10.3.0.1
        abc-hq-f01-acc-02:
          ansible_host: 10.3.0.2
