---
# ============================================================================
# Stage 1 of design.md's "Step 1. Baseline Build" workflow:
#   Apply the baseline template for each device -> Validate device local
#   configuration
# ============================================================================
# Renders each device's platform baseline (catalyst 8000.j2 / nexus 93240.j2
# / catalyst 9000.j2 against wan edge role.yaml / core agg role.yaml /
# access role.yaml) exactly as scripts/render_configs.py does -- same
# templates, same filter_plugins/netascode_filters.py, so there is one
# source of truth for "what a device's config should be" regardless of
# which tool renders it.
#
# Usage:
#   ansible-playbook playbooks/01_baseline_build.yml               # render + push + validate
#   ansible-playbook playbooks/01_baseline_build.yml -e deploy=false  # render + save only, no device touched
- name: Stage 1 - Platform baseline configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Derive this device's platform + role from its hostname
      ansible.builtin.set_fact:
        device_name: "{{ inventory_hostname }}"
        platform: "{{ inventory_hostname | device_platform }}"
        role: "{{ inventory_hostname | device_role }}"

    - name: Fail fast on a hostname the platform/role mapping doesn't recognise
      ansible.builtin.assert:
        that:
          - platform in platform_map
        fail_msg: >-
          {{ inventory_hostname }} did not match any of the -wan-/-cor-/-agg-/-acc-
          naming conventions device_platform() expects (see
          filter_plugins/netascode_filters.py) -- add it to the mapping or
          rename the host before continuing.

    - name: Load this device's platform role baseline data model
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/models/{{ platform_map[platform].baseline_yaml }}"

    - name: Render baseline configuration from this device's own role baseline
      ansible.builtin.set_fact:
        rendered_baseline: "{{ lookup('template', repo_root + '/templates/' + platform_map[platform].baseline_template) }}"

    - name: Save rendered baseline config locally (Single Source of Truth audit trail)
      ansible.builtin.copy:
        content: "{{ rendered_baseline }}"
        dest: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.baseline.cfg"
      delegate_to: localhost

    # -------------------------------------------------------------------
    # Push. src: (not lines:) so the module diffs/pushes the file exactly
    # as rendered -- splitting a rendered config with banners and "!"
    # comment lines into a flat `lines:` list is NOT equivalent and will
    # mis-handle both. Known caveat either way: ios_config/nxos_config's
    # line-by-line diff can behave oddly against multi-line `banner login`
    # blocks -- verify the actual diff (`-C` / --check with --diff) against
    # a lab device before trusting this unattended in production.
    # -------------------------------------------------------------------
    - name: Push baseline config (IOS-XE platforms)
      cisco.ios.ios_config:
        src: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.baseline.cfg"
        save_when: modified
      when: deploy | bool and ansible_network_os == 'cisco.ios.ios'
      register: baseline_push_ios

    - name: Push baseline config (NX-OS platforms)
      cisco.nxos.nxos_config:
        src: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.baseline.cfg"
        save_when: modified
      when: deploy | bool and ansible_network_os == 'cisco.nxos.nxos'
      register: baseline_push_nxos

    # -------------------------------------------------------------------
    # "Validate device local configuration" -- design.md's own wording is
    # generic at this stage (hostname/interfaces/BGP are deliberately NOT
    # part of the baseline template yet, so there's nothing device-specific
    # to check for besides "is it there and talking to us"). Facts-gathering
    # succeeding is the gate; a real deployment would extend this with
    # config-line presence checks (e.g. against rendered_baseline.splitlines()).
    # -------------------------------------------------------------------
    - name: Validate reachability + gather facts (IOS-XE)
      cisco.ios.ios_facts:
        gather_subset: min
      when: deploy | bool and ansible_network_os == 'cisco.ios.ios'
      register: facts_ios

    - name: Validate reachability + gather facts (NX-OS)
      cisco.nxos.nxos_facts:
        gather_subset: min
      when: deploy | bool and ansible_network_os == 'cisco.nxos.nxos'
      register: facts_nxos
