---
# ============================================================================
# Stage 3
#   Apply logical topology template -> Run layer 3 connectivity validation,
#   endpoint vlan validation
# ============================================================================
# Renders templates/logical topology.j2 against logical_topology.yaml:
# loopbacks, per-interface IP addressing, underlay BGP, and (access-vtep
# devices only) the EVPN-VXLAN overlay. platform_baseline is reloaded here
# (same role yaml as stage 1) purely because logical topology.j2 reads
# routing_baseline.bgp_security from it for ttl-security/password lines.
#
# Usage:
#   ansible-playbook playbooks/03_logical_topology.yml
#   ansible-playbook playbooks/03_logical_topology.yml -e deploy=false
- name: Stage 3 - Logical topology (addressing, BGP, EVPN overlay)
  hosts: all
  gather_facts: false
  vars_files:
    - "../models/physical topology.yaml"
    - "../models/logical topology.yaml"
  tasks:
    - name: Derive this device's platform + role from its hostname
      ansible.builtin.set_fact:
        device_name: "{{ inventory_hostname }}"
        platform: "{{ inventory_hostname | device_platform }}"
        role: "{{ inventory_hostname | device_role }}"

    - name: Load this device's platform role baseline (for routing_baseline.bgp_security)
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/models/{{ platform_map[platform].baseline_yaml }}"

    - name: Normalise the loaded baseline under the generic name logical topology.j2 expects
      ansible.builtin.set_fact:
        platform_baseline: "{{ lookup('vars', platform_map[platform].baseline_var) }}"

    - name: Render logical topology configuration for this device
      ansible.builtin.set_fact:
        rendered_logical: "{{ lookup('template', repo_root + '/templates/logical topology.j2') }}"

    - name: Save rendered logical topology config locally
      ansible.builtin.copy:
        content: "{{ rendered_logical }}"
        dest: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.logical.cfg"
      delegate_to: localhost

    - name: Push logical topology config (IOS-XE platforms)
      cisco.ios.ios_config:
        src: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.logical.cfg"
        save_when: modified
      when: deploy | bool and ansible_network_os == 'cisco.ios.ios'

    - name: Push logical topology config (NX-OS platforms)
      cisco.nxos.nxos_config:
        src: "{{ repo_root }}/rendered_configs/{{ inventory_hostname }}.logical.cfg"
        save_when: modified
      when: deploy | bool and ansible_network_os == 'cisco.nxos.nxos'

    - name: Look up this device's own bgp_peers from logical_topology.yaml
      ansible.builtin.set_fact:
        this_device_routing: "{{ site_context | device_routing_record(inventory_hostname) }}"

    - name: Gather BGP summary (IOS-XE)
      cisco.ios.ios_command:
        commands: ["show bgp summary"]
      when: deploy | bool and ansible_network_os == 'cisco.ios.ios'
      register: bgp_ios

    - name: Gather BGP summary (NX-OS)
      cisco.nxos.nxos_command:
        commands: ["show bgp summary"]
      when: deploy | bool and ansible_network_os == 'cisco.nxos.nxos'
      register: bgp_nxos

    - name: Warn about any expected BGP neighbor missing from show bgp summary (IOS-XE)
      ansible.builtin.debug:
        msg: >-
          WARNING: expected iBGP/eBGP neighbor {{ item.peer_ip }}
          ("{{ item.description }}") not found in {{ inventory_hostname }}'s
          show bgp summary output.
      loop: "{{ this_device_routing.bgp_peers }}"
      when: >
        deploy | bool and ansible_network_os == 'cisco.ios.ios'
        and item.peer_ip not in bgp_ios.stdout[0]

    - name: Warn about any expected BGP neighbor missing from show bgp summary (NX-OS)
      ansible.builtin.debug:
        msg: >-
          WARNING: expected iBGP neighbor {{ item.peer_ip }}
          ("{{ item.description }}") not found in {{ inventory_hostname }}'s
          show bgp summary output.
      loop: "{{ this_device_routing.bgp_peers }}"
      when: >
        deploy | bool and ansible_network_os == 'cisco.nxos.nxos'
        and item.peer_ip not in bgp_nxos.stdout[0]

    - name: Gather VLAN brief (access-vtep only)
      cisco.ios.ios_command:
        commands: ["show vlan brief"]
      when: deploy | bool and role == 'access-vtep'
      register: vlan_brief

    - name: Warn about any endpoint VLAN missing from show vlan brief
      ansible.builtin.debug:
        msg: >-
          WARNING: VNI {{ item.vni_id }} ({{ item.name }}) -> VLAN
          {{ item.vlan_id }} not found in {{ inventory_hostname }}'s show
          vlan brief output.
      loop: "{{ site_context.evpn_overlay_design.vni_service_mappings }}"
      when: >
        deploy | bool and role == 'access-vtep'
        and (item.vlan_id | string) not in vlan_brief.stdout[0]
