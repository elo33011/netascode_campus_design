  <path d="M 1100,497 L 1130,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 1100,497 L 1110,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

