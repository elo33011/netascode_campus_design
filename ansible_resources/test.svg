  <path d="M 205,882 L 445,882" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,6"/>
  <path d="M 805,882 L 1045,882" stroke="#ec4899" stroke-width="2" stroke-dasharray="8,6"/>

