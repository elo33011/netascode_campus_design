  <path d="M 1110,192 L 1160,242" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- WAN to Core iBGP Sessions (Dotted) -->
  <path d="M 120,267 L 100,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 160,267 L 200,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 1090,267 L 990,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 1130,267 L 1090,387" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Cross-Domain Core RR Mesh (Dotted) -->
  <path d="M 260,427 L 940,427" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Core-01 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 100,497 L 100,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 100,497 L 360,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 100,497 L 100,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

