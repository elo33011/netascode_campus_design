  <path d="M 220,497 L 130,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 220,497 L 400,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 220,497 L 160,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Core-03 to Agg & Access iBGP Client Sessions (Dotted) -->
  <path d="M 980,497 L 840,597" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
  <path d="M 980,497 L 1100,597" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 980,497 L 1060,807" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

